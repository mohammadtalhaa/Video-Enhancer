<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 4K Cinematic AI Enhancer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 4K Cinematic AI</h1>
            <p>Upscale to 4K &amp; apply Hollywood color grading. <strong>Runs entirely on your GPU.</strong></p>
        </header>

        <!-- Upload -->
        <section class="upload-section">
            <label for="fileInput" class="upload-btn">
                📁 Select Video
                <input type="file" id="fileInput" accept="video/*" />
            </label>
            <span id="fileName">No file selected</span>
        </section>

        <!-- Settings -->
        <section class="settings">
            <div class="setting-group">
                <label for="networkSelect">AI Model:</label>
                <select id="networkSelect">
                    <option value="cnn-2x-s">Small (⚡ Fastest)</option>
                    <option value="cnn-2x-m" selected>Medium (🎯 Balanced)</option>
                    <option value="cnn-2x-l">Large (🏆 Best Quality)</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="gradeToggle">🎨 Cinematic Grade:</label>
                <input type="checkbox" id="gradeToggle" checked />
            </div>
        </section>

        <!-- Video Boxes -->
        <section class="video-section">
            <div class="video-box">
                <p>📼 Original</p>
                <video id="sourceVideo" controls muted></video>
            </div>
            <div class="video-box">
                <p>✨ Enhanced (4K + Cinematic)</p>
                <canvas id="outputCanvas"></canvas>
            </div>
        </section>

        <!-- Controls -->
        <section class="controls">
            <button id="enhanceBtn" disabled>⚡ Enhance to 4K</button>
            <button id="downloadBtn" disabled>⬇️ Download 4K Video</button>
            <div id="status">⏳ Waiting for video...</div>
        </section>

        <footer>
            <p>⚡ 100% local processing. Your video never leaves your device.</p>
        </footer>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
