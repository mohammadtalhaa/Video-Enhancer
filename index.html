<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4K AI Video Enhancer</title>
<link rel="stylesheet" href="style.css?v=1" />
</head>
<body>

  <header class="app-header">
    <h1>4K AI Video Enhancer</h1>
    <p class="subtitle">Free · 100% client-side · WebGPU AI upscaling + cinematic color grade</p>
  </header>

  <main class="app-main">

    <section class="controls-panel">

      <div class="control-group">
        <label class="control-label" for="fileInput">1. Choose a video</label>
        <div class="file-upload-row">
          <label class="btn btn-secondary file-btn" for="fileInput">Choose Video</label>
          <input type="file" id="fileInput" accept="video/*" hidden />
          <span id="fileName" class="file-name">No file selected</span>
        </div>
      </div>

      <div class="control-group">
        <label class="control-label" for="modelSelect">2. AI upscaling model</label>
        <select id="modelSelect" class="select-input">
          <option value="cnn-2x-s">Small — fastest, lower quality</option>
          <option value="cnn-2x-m" selected>Medium — balanced</option>
          <option value="cnn-2x-l">Large — best quality, slowest</option>
        </select>
      </div>

      <div class="control-group control-row">
        <label class="checkbox-row" for="gradeToggle">
          <input type="checkbox" id="gradeToggle" checked />
          <span>Cinematic Grade (Teal &amp; Orange)</span>
        </label>
      </div>

      <div class="control-group control-row buttons-row">
        <button id="enhanceBtn" class="btn btn-primary" disabled>Enhance Video</button>
        <button id="downloadBtn" class="btn btn-accent" disabled>Download 4K Video</button>
      </div>

      <div class="control-group">
        <div id="status" class="status-box">Waiting for a video...</div>
      </div>

    </section>

    <section class="preview-panel">
      <div class="video-pane">
        <h2>Original</h2>
        <video id="originalVideo" class="video-el" controls playsinline></video>
      </div>
      <div class="video-pane">
        <h2>Enhanced (4K + Cinematic Grade)</h2>
        <canvas id="outputCanvas" class="canvas-el"></canvas>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p>Runs entirely in your browser. Nothing is uploaded to a server.</p>
  </footer>

  <script type="module" src="script.js?v=1"></script>
</body>
</html>
